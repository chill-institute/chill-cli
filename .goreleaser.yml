version: 2

project_name: chilly

builds:
  - id: chilly
    main: ./cmd/chilly
    binary: chilly
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/chill-institute/chill-cli/v2/internal/buildinfo.version={{ .Version }}
      - -X github.com/chill-institute/chill-cli/v2/internal/buildinfo.commit={{ .Commit }}
      - -X github.com/chill-institute/chill-cli/v2/internal/buildinfo.date={{ .CommitDate }}

archives:
  - id: chilly
    ids:
      - chilly
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE*
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README*
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

release:
  github:
    owner: chill-institute
    name: chill-cli
  draft: true
  use_existing_draft: true
  replace_existing_artifacts: true
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: git

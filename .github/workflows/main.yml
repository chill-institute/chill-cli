name: Main

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  verify:
    concurrency:
      group: main-verify-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Cache Go dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', 'go.sum', '.golangci.yml') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('mise.toml', 'go.sum') }}
            ${{ runner.os }}-go-

      - name: Verify
        run: mise run verify

  release:
    needs: [verify]
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release_target.outputs.tag }}
      version: ${{ steps.release_target.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: false

      - name: Tag next release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release target
        id: release_target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_RELEASE_PUBLISHED: ${{ steps.semantic_release.outputs.new_release_published }}
          NEW_RELEASE_TAG: ${{ steps.semantic_release.outputs.new_release_git_tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          tag=""
          if [[ "$NEW_RELEASE_PUBLISHED" == "true" ]]; then
            tag="$NEW_RELEASE_TAG"
          else
            candidates=()
            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] || continue
              if ! release_json="$(gh release view "$candidate" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null)"; then
                candidates+=("$candidate")
              elif [[ "$(jq -r '.isDraft' <<<"$release_json")" == "true" ]]; then
                candidates+=("$candidate")
              fi
            done < <(git tag --points-at "$GITHUB_SHA" --list 'v*' --sort=-version:refname)

            if (( ${#candidates[@]} > 1 )); then
              printf 'Multiple unpublished release tags point at %s: %s\n' "$GITHUB_SHA" "${candidates[*]}" >&2
              exit 1
            fi
            if (( ${#candidates[@]} == 1 )); then
              tag="${candidates[0]}"
            fi
          fi

          if [[ -z "$tag" ]]; then
            echo 'No new or resumable release found.'
            exit 0
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Refusing invalid release tag: %s\n' "$tag" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]]; then
            printf 'Release tag %s does not point at workflow commit %s\n' "$tag" "$GITHUB_SHA" >&2
            exit 1
          fi

          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

  publish:
    needs: [release]
    if: ${{ needs.release.outputs.tag != '' }}
    concurrency:
      group: cli-release-main
      cancel-in-progress: false
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/_release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      ref: ${{ needs.release.outputs.tag }}
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

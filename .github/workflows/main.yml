name: Main

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  verify:
    concurrency:
      group: main-verify-${{ github.ref }}
      cancel-in-progress: true
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out API contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: chill-institute/chill-contracts
          ref: b2c0a3f8c59ec4214ed71db8978393a8721d6adf # v2.6.2
          path: .contracts/chill-contracts
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Cache Go dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/golangci-lint
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('mise.toml', 'go.sum', '.golangci.yml') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('mise.toml', 'go.sum') }}
            ${{ runner.os }}-go-

      - name: Verify
        run: mise run verify

      - name: Verify API contract parity
        env:
          CHILLY_CONTRACTS_PROTO: ${{ github.workspace }}/.contracts/chill-contracts/proto/chill/v4/api.proto
        run: mise run contracts:check

  release:
    needs: [verify]
    if: ${{ needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release_target.outputs.tag }}
      version: ${{ steps.release_target.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false

      - name: Mint a chill-ci token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CHILL_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHILL_CI_APP_PRIVATE_KEY }}
          owner: chill-institute
          repositories: chill-cli
          permission-contents: write

      - name: Tag next release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

      - name: Resolve release target
        id: release_target
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NEW_RELEASE_PUBLISHED: ${{ steps.semantic_release.outputs.new_release_published }}
          NEW_RELEASE_TAG: ${{ steps.semantic_release.outputs.new_release_git_tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          tag=""
          if [[ "$NEW_RELEASE_PUBLISHED" == "true" ]]; then
            tag="$NEW_RELEASE_TAG"
          else
            candidates=()
            while IFS= read -r candidate; do
              [[ -n "$candidate" ]] || continue
              if ! release_json="$(gh release view "$candidate" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null)"; then
                candidates+=("$candidate")
              elif [[ "$(jq -r '.isDraft' <<<"$release_json")" == "true" ]]; then
                candidates+=("$candidate")
              fi
            done < <(git tag --points-at "$GITHUB_SHA" --list 'v*' --sort=-version:refname)

            if (( ${#candidates[@]} > 1 )); then
              printf 'Multiple unpublished release tags point at %s: %s\n' "$GITHUB_SHA" "${candidates[*]}" >&2
              exit 1
            fi
            if (( ${#candidates[@]} == 1 )); then
              tag="${candidates[0]}"
            fi
          fi

          if [[ -z "$tag" ]]; then
            echo 'No new or resumable release found.'
            exit 0
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Refusing invalid release tag: %s\n' "$tag" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "$tag")" != "$GITHUB_SHA" ]]; then
            printf 'Release tag %s does not point at workflow commit %s\n' "$tag" "$GITHUB_SHA" >&2
            exit 1
          fi

          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${tag#v}" >>"$GITHUB_OUTPUT"

  publish:
    needs: [release]
    if: ${{ needs.release.outputs.tag != '' }}
    concurrency:
      group: cli-release-main
      cancel-in-progress: false
    permissions:
      attestations: write
      contents: write
      id-token: write
    # Await actionlint support: https://github.com/rhysd/actionlint/issues/711
    uses: ./.github/workflows/_release.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ needs.release.outputs.tag }}
      ref: ${{ needs.release.outputs.tag }}
    secrets:
      CHILL_CI_APP_PRIVATE_KEY: ${{ secrets.CHILL_CI_APP_PRIVATE_KEY }}

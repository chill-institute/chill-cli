name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions: {}

jobs:
  publish:
    concurrency:
      group: cli-release-main
      cancel-in-progress: false
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/_release.yml
    with:
      tag: ${{ inputs.tag }}
      ref: ${{ inputs.tag }}
      verify: true
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

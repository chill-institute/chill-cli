name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

permissions: {}

jobs:
  publish:
    concurrency:
      group: cli-release-main
      cancel-in-progress: false
    permissions:
      attestations: write
      contents: write
      id-token: write
    # Await actionlint support: https://github.com/rhysd/actionlint/issues/711
    uses: ./.github/workflows/_release.yml # zizmor: ignore[self-repository]
    with:
      tag: ${{ inputs.tag }}
      ref: ${{ inputs.tag }}
      verify: true
    secrets:
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

[tools]
go = "1.26.5"

[env]
GOWORK = "off"

[settings]
experimental = true

[hooks]
postinstall = "mise run hooks"

[tasks.fmt]
description = "Format Go sources"
run = """
go_files="$(git ls-files '*.go')"
if [ -z "$go_files" ]; then
  exit 0
fi

printf '==> formatting Go files with goimports and gofmt\n'
printf '%s\n' "$go_files" | while IFS= read -r file; do
  [ -n "$file" ] || continue
  [ -f "$file" ] || continue
  go tool goimports -w "$file"
  gofmt -w "$file"
done
"""

[tasks."fmt:check"]
description = "Check Go source formatting"
run = """
go_files="$(git ls-files '*.go')"
if [ -z "$go_files" ]; then
  exit 0
fi

gofmt_files=''
goimports_files=''
gofmt_tmp=''
goimports_tmp=''
cleanup_fmt_check() {
  rm -f "$gofmt_tmp" "$goimports_tmp"
}
trap cleanup_fmt_check EXIT
gofmt_tmp="$(mktemp "${TMPDIR:-/tmp}/chilly-fmt-gofmt.XXXXXX")"
goimports_tmp="$(mktemp "${TMPDIR:-/tmp}/chilly-fmt-goimports.XXXXXX")"

printf '%s\n' "$go_files" | while IFS= read -r file; do
  [ -n "$file" ] || continue
  [ -f "$file" ] || continue
  gofmt_output="$(gofmt -l "$file")"
  if [ -n "$gofmt_output" ]; then
    printf '%s\n' "$gofmt_output" >> "$gofmt_tmp"
  fi
  goimports_output="$(go tool goimports -l "$file")"
  if [ -n "$goimports_output" ]; then
    printf '%s\n' "$goimports_output" >> "$goimports_tmp"
  fi
done

gofmt_files="$(cat "$gofmt_tmp")"
goimports_files="$(cat "$goimports_tmp")"

if [ -z "$gofmt_files" ] && [ -z "$goimports_files" ]; then
  printf '==> Go formatting is clean\n'
  exit 0
fi

if [ -n "$gofmt_files" ]; then
  printf 'gofmt needs to be run on:\n%s\n' "$gofmt_files" >&2
fi
if [ -n "$goimports_files" ]; then
  printf 'goimports needs to be run on:\n%s\n' "$goimports_files" >&2
fi
exit 1
"""

[tasks."fmt:staged"]
description = "Format staged Go files and restage them"
run = """
staged_go_files="$(git diff --cached --name-only --diff-filter=ACMR -- '*.go')"
if [ -z "$staged_go_files" ]; then
  exit 0
fi

printf '==> formatting staged Go files\n'
printf '%s\n' "$staged_go_files" | while IFS= read -r file; do
  [ -n "$file" ] || continue
  go tool goimports -w "$file"
  gofmt -w "$file"
done
printf '%s\n' "$staged_go_files" | while IFS= read -r file; do
  [ -n "$file" ] || continue
  git add -- "$file"
done
"""

[tasks."hooks:pre-commit"]
description = "Hook entrypoint for formatting staged Go files"
run = "mise run fmt:staged"

[tasks."hooks:pre-push"]
description = "Hook entrypoint for full repo verification before push"
run = """
printf '==> running CLI verify before push\n'
mise run verify
"""

[tasks.lint]
description = "Run static analysis"
run = "go tool golangci-lint run ./..."

[tasks."mod:check"]
description = "Ensure go.mod and go.sum are tidy without mutating them"
run = "go mod tidy -diff"

[tasks.test]
description = "Run CLI unit tests"
run = "go test ./..."

[tasks."test:integration"]
description = "Run opt-in live integration tests against a real API surface"
run = """
if [ -f .env.local ]; then
  set -a
  . ./.env.local
  set +a
fi
if [ -z "${CHILLY_TEST_API_URL:-}" ] || [ -z "${CHILLY_TEST_TOKEN:-}" ]; then
  printf 'CHILLY_TEST_API_URL and CHILLY_TEST_TOKEN are required for integration tests\n' >&2
  exit 1
fi
go test -count=1 -tags=integration ./internal/cli -run '^TestLive'
"""

[tasks.smoke]
description = "Run fast local CLI smoke checks"
run = """
tmpdir="$(mktemp -d)"
config="$tmpdir/config.json"
trap 'rm -rf "$tmpdir"' EXIT

go run ./cmd/chilly version --output json >/dev/null
go run ./cmd/chilly --config "$config" doctor --offline --output json >/dev/null
go run ./cmd/chilly schema command search --output json >/dev/null
printf '{"url":"magnet:?xt=urn:btih:test"}' | go run ./cmd/chilly --config "$config" add-transfer --json @- --dry-run --output json >/dev/null
"""

[tasks."npm:prepare"]
description = "Prepare npm package directories from GoReleaser dist artifacts"
run = "go run ./scripts/npm-package --version \"${CHILLY_NPM_VERSION:-}\""

[tasks."npm:pack"]
description = "Dry-run pack generated npm package directories"
depends = ["npm:prepare"]
run = """
for package_dir in dist/npm/cli-* dist/npm/cli; do
  [ -d "$package_dir" ] || continue
  npm pack --dry-run "$package_dir" >/dev/null
done
"""

[tasks.coverage]
description = "Run tests with coverage threshold"
run = """
threshold="${MISE_COVERAGE_THRESHOLD:-85}"

printf '==> running Go tests with coverage (threshold: %s%%)\n' "$threshold"
go test ./... -covermode=atomic -coverprofile=coverage.out

total_coverage="$(
  go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }'
)"

if [ -z "$total_coverage" ]; then
  printf 'failed to determine total coverage from coverage.out\n' >&2
  exit 1
fi

printf '==> total coverage: %s%%\n' "$total_coverage"

awk -v total="$total_coverage" -v threshold="$threshold" '
  BEGIN {
    if ((total + 0) < (threshold + 0)) {
      printf("coverage %.1f%% is below threshold %.1f%%\\n", total + 0, threshold + 0) > "/dev/stderr"
      exit 1
    }
  }
'
"""

[tasks."coverage:report"]
description = "Show package coverage and the lowest-covered functions"
run = """
if [ ! -f coverage.out ]; then
  go test ./... -covermode=atomic -coverprofile=coverage.out
fi

printf '==> package coverage\n'
go test ./... -covermode=atomic -coverprofile=/tmp/chilly-cover-report.out >/tmp/chilly-cover-report.log
tail -n 20 /tmp/chilly-cover-report.log

printf '\n==> lowest-covered functions\n'
go tool cover -func=coverage.out | sort -k3,3n | sed -n '1,25p'
"""

[tasks.security]
description = "Run dependency vulnerability scan"
run = "go tool govulncheck ./..."

[tasks."contracts:check"]
description = "Check local schema metadata against a sibling chill-contracts proto checkout"
run = """
repo_root="$(git rev-parse --show-toplevel)"
proto_path="${CHILLY_CONTRACTS_PROTO:-$repo_root/../chill-contracts/proto/chill/v4/api.proto}"
CHILLY_CONTRACTS_PROTO="$proto_path" CHILLY_REQUIRE_CONTRACTS=1 go test ./internal/cli -run '^TestLocalSchemaMatchesContractsProto$'
"""

[tasks.hooks]
description = "Install repo git hooks"
run = """
repo_root="$(git rev-parse --show-toplevel)"
cd "$repo_root"
git config core.hooksPath .githooks
printf 'git hooks configured: %s/.githooks\n' "$repo_root"
"""

[tasks.verify]
description = "Run formatting, lint, coverage, and security checks"
depends = ["fmt:check", "mod:check", "lint", "coverage", "security"]
